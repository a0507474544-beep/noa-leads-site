<style>
/* Layout: dispatch board. Sticky control deck on top, a dense list grouped by city, a side sheet for one lead. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#e8efed; --line:#cfe0df;
  --ink:#143038; --muted:#5e757e; --accent:#1c7b82; --accent-ink:#ffffff; --accent-soft:#d9efee;
  --sign:#8fd3c4;
  --st-new:#5e757e; --st-new-bg:#e8efed;
  --st-wait:#7a5d12; --st-wait-bg:#f8eccd;
  --st-int:#2e70a8; --st-int-bg:#dde9f6;
  --st-proc:#6c3f91; --st-proc-bg:#ece3f5;
  --st-hired:#11683a; --st-hired-bg:#d6f0df;
  --st-no:#9b2c2c; --st-no-bg:#f7dede;
  --shadow:0 12px 32px rgba(14,58,68,.20);
  --f-display:"Frank Ruhl Libre","Heebo",Georgia,serif;
  --f-body:"Heebo",Arial,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08232a; --surface:#0e323b; --surface-2:#133f49; --line:#1f525c;
  --ink:#e6f1f0; --muted:#93b0b5; --accent:#3fc1b8; --accent-ink:#08232a; --accent-soft:#124a4f;
  --sign:#8fd3c4;
  --st-new:#a9bec2; --st-new-bg:#1a3d45;
  --st-wait:#f0c96a; --st-wait-bg:#3b3220;
  --st-int:#8cbcec; --st-int-bg:#16334d;
  --st-proc:#cfa2e8; --st-proc-bg:#33243d;
  --st-hired:#7fd6a2; --st-hired-bg:#173a2a;
  --st-no:#f0a3a3; --st-no-bg:#3e2222;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08232a; --surface:#0e323b; --surface-2:#133f49; --line:#1f525c;
  --ink:#e6f1f0; --muted:#93b0b5; --accent:#3fc1b8; --accent-ink:#08232a; --accent-soft:#124a4f;
  --sign:#8fd3c4;
  --st-new:#a9bec2; --st-new-bg:#1a3d45;
  --st-wait:#f0c96a; --st-wait-bg:#3b3220;
  --st-int:#8cbcec; --st-int-bg:#16334d;
  --st-proc:#cfa2e8; --st-proc-bg:#33243d;
  --st-hired:#7fd6a2; --st-hired-bg:#173a2a;
  --st-no:#f0a3a3; --st-no-bg:#3e2222;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px}
.brand .sign{background:var(--sign);color:#143038;font-family:var(--f-body);font-weight:600;font-size:13px;padding:1px 8px;border-radius:3px}
.brand small{color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:13px}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--ink);margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--surface-2);border-radius:7px 7px 0 0;padding:6px 11px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--muted)}
.tab b{font-variant-numeric:tabular-nums;font-weight:600;margin-inline-start:4px}
.tab.drv{border-top:3px solid var(--sign)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface);cursor:pointer;white-space:nowrap;font-size:13px}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.follow{border-style:dashed}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 11px}
.filters select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;max-width:100%;flex:0 1 auto}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;max-width:1200px;margin:0 auto}
.status-line{color:var(--muted);font-size:13px;margin:0 0 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status-line .warn{color:var(--st-wait)}
.group-h{position:sticky;top:var(--deck-h,150px);z-index:2;background:var(--bg);font-family:var(--f-display);font-size:15px;padding:10px 2px 6px;display:flex;gap:8px;align-items:baseline;border-bottom:2px solid var(--ink)}
.group-h span{font-family:var(--f-body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:0;margin-bottom:6px}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2.4fr) 120px 118px 86px;gap:12px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:right;border-inline:0;border-top:0;width:100%}
.row:hover{background:var(--surface-2)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .job{min-width:0}
.row .job div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ph{font-variant-numeric:tabular-nums;direction:ltr;text-align:right;font-size:13px}
.row .dt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:left}
.pill{display:inline-block;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.g-new{color:var(--st-new);background:var(--st-new-bg)} .g-wait{color:var(--st-wait);background:var(--st-wait-bg)}
.g-int{color:var(--st-int);background:var(--st-int-bg)} .g-proc{color:var(--st-proc);background:var(--st-proc-bg)}
.g-hired{color:var(--st-hired);background:var(--st-hired-bg)} .g-no{color:var(--st-no);background:var(--st-no-bg)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.tag.lic{border-color:var(--sign);color:var(--ink)}
.tag.fu{background:var(--sign);border-color:var(--sign);color:#143038}
.more{display:flex;justify-content:center;padding:16px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a d" "b c";row-gap:4px}
  .row .who{grid-area:a;min-width:0} .row .job{grid-area:b} .row .ph{grid-area:c;text-align:left} .row .st{grid-area:d;justify-self:end} .row .dt{display:none}
}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,35,42,.45);z-index:20}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.sheet header{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.sheet header .meta{color:var(--muted);font-size:13px;margin-top:3px}
.sheet .x{margin-inline-start:auto;border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.sheet .body{overflow-y:auto;padding:14px 18px 24px;display:grid;gap:16px}
.phone-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.phone-box .num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;user-select:all;margin-inline-end:auto}
.phone-box a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px}
.phone-box a.dial{color:var(--accent-ink);text-decoration:none}
.dial-row{color:var(--accent);text-decoration:none;font-weight:600}
.dial-row:hover{text-decoration:underline}
dl.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px} dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec h3{font-size:12px;letter-spacing:.6px;color:var(--muted);margin:0 0 6px;font-weight:600}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-grid label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.edit-grid input,.edit-grid select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.calls{display:grid;gap:8px;margin-top:8px}
.call{border-inline-start:3px solid var(--accent);background:var(--surface-2);padding:7px 10px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.call time{display:block;color:var(--muted);font-size:12px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.reason{background:var(--surface-2);border-radius:8px;padding:9px 11px;white-space:pre-wrap;font-size:13.5px}
.saved{color:var(--st-hired);font-size:12.5px}
.cvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cvview{margin-top:10px;display:grid;gap:8px;max-height:70vh;overflow:auto;background:var(--surface-2);border-radius:8px}
.cvview:empty{display:none}
.cvview canvas,.cvview img{display:block;width:100%;height:auto;background:#fff;border-radius:4px}
.cvview .doc{background:#fff;color:#143038;padding:16px;border-radius:4px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.cvview .doc img{max-width:100%}
.cvname{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meter{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.imp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.imp-stats div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.imp-stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.imp-stats span{font-size:12px;color:var(--muted)}
.tag.cv{border-color:var(--accent);color:var(--accent)}
.err{color:var(--st-no);font-size:12.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form-grid input,.form-grid select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%}
@media (max-width:520px){.edit-grid,.form-grid{grid-template-columns:1fr} dl.facts{grid-template-columns:90px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

:focus-visible{outline:none;box-shadow:var(--ring)!important}

<script>
(function(){
const GROUPS=[
  {k:'all',t:'הכל'},
  {k:'טרם נבדק',t:'טרם נבדק',c:'g-new',dot:'var(--st-new)'},
  {k:'ממתין לתשובה',t:'ממתין לתשובה',c:'g-wait',dot:'var(--st-wait)'},
  {k:'זומן / עבר ראיון',t:'זומן / עבר ראיון',c:'g-int',dot:'var(--st-int)'},
  {k:'בתהליך',t:'בתהליך',c:'g-proc',dot:'var(--st-proc)'},
  {k:'התקבל לעבודה',t:'התקבל לעבודה',c:'g-hired',dot:'var(--st-hired)'},
  {k:'לא רלוונטי',t:'לא רלוונטי',c:'g-no',dot:'var(--st-no)'},
];
const GCLASS=Object.fromEntries(GROUPS.filter(g=>g.c).map(g=>[g.k,g.c]));
const STATUSES=['טרם נבדק','אין תגובה','לא ענה - לחזור','ממתין לתשובת מעסיק','ממתין לתשובה שלנו','זומן לראיון','זומן ליום ניסיון','עבר ראיון - חיובי','בתהליך','ממתין להשלמת מסמכים','התקבל לעבודה','לא רלוונטי','לא רלוונטי - לא מעוניין','לא רלוונטי - מצא עבודה','לא רלוונטי - מיקום','לא רלוונטי - שכר','לא רלוונטי - הבריז','לא רלוונטי - עזב','לא רלוונטי - פוטר'];
const FIELDS=['נהגים','מחסן / לוגיסטיקה','משרד / שירות לקוחות','ניהול / פיקוח','מכירות','טכנאים','ייצור / הרכבה','מלגזנים','הנהלת חשבונות','מזון / קייטרינג','עוזרי נהג','מנופאים','חשמלאים','אחזקה','קמעונאות / חנויות','ניקיון','הנדסה','אבטחה','כללי'];
const LICS=['ב','C1 - עד 12 טון','C - עד 15 ומעל','E - סמיטריילר','D - אוטובוס','לא צוין'];
function grp(s){s=s||'';
  if(!s||s.startsWith('טרם נבדק'))return 'טרם נבדק';
  if(s.startsWith('לא רלוונטי')||s.startsWith('עזב')||s.startsWith('פוטר'))return 'לא רלוונטי';
  if(s.startsWith('זומן')||s.startsWith('עבר')||s.startsWith('עברה')||s.startsWith('אושר'))return 'זומן / עבר ראיון';
  if(s.startsWith('בתהליך')||s.startsWith('ממתין להשלמת'))return 'בתהליך';
  if(s.startsWith('התקבל'))return 'התקבל לעבודה';
  return 'ממתין לתשובה';}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=p=>String(p||'').replace(/\D/g,'');
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?d.split('-').reverse().join('.'):'';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let RMPH=new Set();
let BASE=[], ADDED=[], EDITS={}, byId=new Map();
let db=null, downloads=null, canWrite=true, dbState='loading';
const st=Object.assign({g:'all',q:'',field:'',lic:'',city:'',sort:'city',fu:false},LS.get('leads.filters',{}));st.q='';
let shown=150, openKey=null;

// ---------- data
function key(l){return l.ids[0]}
function eff(l){const e=EDITS[l._k]||{};return {
  status:e.status??l.s, phone:e.phone??l.p, city:e.city??l.c, followUp:e.followUp||'', calls:e.calls||[], touched:e.updatedAt||'', removed:!!e.removed, removedReason:e.removedReason||'', removedAt:e.removedAt||'',
}}
function all(){return BASE.concat(ADDED)}
function indexLeads(){byId=new Map();for(const l of all()){for(const id of l.ids)byId.set(id,l);}}
function remapEdits(raw){ // edit docs are keyed by any of the lead's thread ids
  const out={};for(const [id,v] of Object.entries(raw)){const l=byId.get(id);if(l){out[l._k]=Object.assign(out[l._k]||{},v);}}
  EDITS=out;}
let RAW={};

fetch('leads.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
  BASE=j.map(l=>(l._k=key(l),l));indexLeads();remapEdits(RAW);buildSelects();render();
}).catch(()=>{$('out').innerHTML='<div class="empty">לא הצלחתי לטעון את רשימת המועמדים. רענן את הדף.</div>'});

(async()=>{
  try{db=await window.claude?.use?.('db');}catch(e){db=null}
  try{downloads=await window.claude?.use?.('downloads');}catch(e){downloads=null}
  try{const u=await window.claude?.use?.('user');if(u){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  try{assets=await window.claude?.use?.('assets');}catch(e){assets=null}
  if(!db){dbState='off';render();return;}
  db.collection('cv').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());CVIDX=o;render();if(impOpen)drawImport();},e=>{});
  if(assets){getMcp().then(m=>{if(m)$('importBtn').hidden=false})}
  const timer=setTimeout(()=>{if(dbState==='loading'){dbState='slow';render();}},10000);
  db.collection('edits').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);dbState='ok';}
    RAW={};snap.docs.forEach(d=>RAW[d.id]=d.data());remapEdits(RAW);render();if(openKey)refreshSheet();
  },e=>{clearTimeout(timer);dbState='err';render();});
  db.collection('added').onSnapshot(snap=>{
    const baseIds=new Set();BASE.forEach(l=>l.ids.forEach(i=>baseIds.add(i)));
    const basePh=new Set();BASE.forEach(l=>{const d=digits(l.p);if(d)basePh.add(d)});
    ADDED=snap.docs.filter(d=>{if(baseIds.has(d.id))return false;const ph=digits((d.data()||{}).p);if(ph){if(basePh.has(ph))return false;basePh.add(ph)}return true}).map(d=>{const v=d.data();return {fromMail:v.src==='mail',ids:[d.id],_k:d.id,n:v.n||'',p:v.p||'',a:v.a||'',c:v.c||'',f:v.f||'כללי',r:v.r||'',co:v.co||'',s:v.s||'טרם נבדק',rs:v.rs||'',d:v.d||'',no:v.src==='mail'?'נכנס אוטומטית מהמייל':'נוסף ידנית',l:v.l||'',added:true}});
    indexLeads();remapEdits(RAW);buildSelects();render();if(openKey)refreshSheet();
  },e=>{});
})();

// ---------- filters UI
function buildSelects(){
  const A=all();
  const fc={};A.forEach(l=>{if(l.f!=='נהגים')fc[l.f]=(fc[l.f]||0)+1});
  const lc={};A.forEach(l=>{if(l.f==='נהגים'){const k=l.l||'לא צוין';lc[k]=(lc[k]||0)+1}});
  const tabs=[{f:'',l:'',t:'כל המועמדים',n:A.length}]
    .concat(LICS.filter(x=>lc[x]).map(x=>({f:'נהגים',l:x,t:x==='ב'?'נהגים - רישיון ב':x==='לא צוין'?'נהגים - רישיון לא צוין':'נהגים '+x,n:lc[x],drv:1})))
    .concat(Object.keys(fc).sort((a,b)=>(a==='כללי')-(b==='כללי')||fc[b]-fc[a]).map(f=>({f,l:'',t:f.replace(' / ',' - '),n:fc[f]})));
  $('tabs').innerHTML=tabs.map(t=>`<button type="button" role="tab" class="tab${t.drv?' drv':''}" data-f="${esc(t.f)}" data-l="${esc(t.l)}" aria-selected="${st.field===t.f&&st.lic===t.l}">${esc(t.t)}<b>${t.n.toLocaleString('he-IL')}</b></button>`).join('');
  const cc={};A.forEach(l=>{const c=(eff(l).city||'').trim();if(c&&!c.startsWith('('))cc[c]=(cc[c]||0)+1});
  const cities=Object.keys(cc).sort((a,b)=>a.localeCompare(b,'he'));
  $('fCity').innerHTML=['<option value="">כל הערים</option>','<option value="__none">בלי עיר</option>'].concat(cities.map(c=>`<option value="${esc(c)}">${esc(c)} (${cc[c]})</option>`)).join('');$('fCity').value=st.city;
}
function saveFilters(){LS.set('leads.filters',{g:st.g,field:st.field,lic:st.lic,city:st.city,sort:st.sort,fu:st.fu})}
$('q').addEventListener('input',e=>{st.q=e.target.value.trim();shown=150;render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;st.field=b.dataset.f;st.lic=b.dataset.l;shown=150;saveFilters();
  $('tabs').querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
$('fCity').addEventListener('change',e=>{st.city=e.target.value;shown=150;saveFilters();render()});
$('fSort').addEventListener('change',e=>{st.sort=e.target.value;shown=150;saveFilters();render()});
$('fSort').value=st.sort;

function matches(l,E,ignoreGroup){
  if(!!E.removed!==!!st.rm)return false;
  if(!E.removed&&RMPH.size&&RMPH.has(digits(E.phone)))return false;
  if(st.field&&l.f!==st.field)return false;
  if(st.lic&&(l.l||'לא צוין')!==st.lic)return false;
  const city=(E.city||'').trim();
  if(st.city==='__none'){if(city&&!city.startsWith('('))return false}else if(st.city&&city!==st.city)return false;
  if(!ignoreGroup){
    if(st.fu){if(!E.followUp||E.followUp>today())return false}
    else if(st.g!=='all'&&grp(E.status)!==st.g)return false;
  }
  if(st.q){const q=st.q.toLowerCase(),qd=digits(st.q);
    const hay=(l.n+' '+city+' '+l.co+' '+l.r+' '+E.status).toLowerCase();
    if(!(hay.includes(q)||(qd.length>=3&&digits(E.phone).includes(qd))))return false;}
  return true;
}

function render(){
  const A=all();
  const effs=new Map(A.map(l=>[l,eff(l)]));
  RMPH=new Set();for(const [l,E] of effs){if(E.removed){const d=digits(E.phone);if(d)RMPH.add(d)}}
  // pipeline counts reflect the other filters
  const cnt={all:0};let fuCount=0,rmCount=0;for(const l of A){const E=effs.get(l);if(E.removed)rmCount++}

async function bundleBytes(id){if(BUNDLES.has(id))return BUNDLES.get(id);const res=await fetch('/_blob/'+id);if(!res.ok)throw new Error('missing');const u=new Uint8Array(await res.arrayBuffer());BUNDLES.clear();BUNDLES.set(id,u);return u}

async function drawCV(l,a){

// ---------- export every stored CV file as zip parts (one-time move to the new system)
let expRun=false,expMsg='';
async function exportFiles(){
  if(expRun||!downloads)return;
  const ids=[...new Set(Object.values(CVIDX).map(d=>d&&d.a).filter(Boolean))];
  if(!ids.length){expMsg='אין קבצים שמורים לייצוא.';drawImport();return}
  expRun=true;const setMsg=t=>{expMsg=t;const el=$('expMsg');if(el)el.textContent=t;else drawImport()};
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const LIMIT=150*1048576,missing=[];let part=1,done=0,zip=new window.JSZip(),bytes=0,types={};
    const flush=async last=>{
      if(!Object.keys(types).length)return;
      zip.file('manifest.json',JSON.stringify({part,types}));
      setMsg(`אורז חלק ${part}…`);
      const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
      for(;;){try{await downloads.save({filename:`cv-files-part-${String(part).padStart(2,'0')}.zip`,data:blob});break}
        catch(e){if(e&&e.code==='rate_limited'){await new Promise(r=>setTimeout(r,3000));continue}throw e}}
      part++;zip=new window.JSZip();bytes=0;types={};
    };
    for(const id of ids){
      if(!expRun)break;
      try{const r=await fetch('/_blob/'+id);if(!r.ok)throw 0;const b=await r.blob();zip.file(id,b);types[id]=r.headers.get('content-type')||b.type||'application/octet-stream';bytes+=b.size}
      catch(e){missing.push(id)}
      done++;if(done%50===0)setMsg(`מכין קבצים: ${done.toLocaleString('he-IL')} מתוך ${ids.length.toLocaleString('he-IL')}`);
      if(bytes>=LIMIT)await flush(false);
    }
    await flush(true);
    setMsg(`הייצוא הסתיים: ${part-1} קובצי zip, ${(ids.length-missing.length).toLocaleString('he-IL')} קבצים${missing.length?`, ${missing.length} לא נמצאו`:''}.`);
  }catch(e){setMsg(e&&e.code==='declined'?'ההורדה בוטלה. אפשר להתחיל שוב.':'הייצוא נכשל. נסו שוב.')}
  expRun=false;drawImport();
}
function stopImport(m){impRun=false;flushBundle().catch(()=>{});impMsg=m||'';try{wake&&wake.release()}catch(e){}wake=null;drawImport()}
async function startImport(){
  impRun=true;impMsg='';impStats={ok:0,none:0,err:0};drawImport();
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  const queue=impTodo();let i=0;
  async function worker(){
    while(impRun&&i<queue.length){const l=queue[i++];if(CVIDX[l._k])continue;
      try{const a=await fetchCV(l,true);
        if(!a){await db.collection('cv').doc(l._k).set({none:true,at:new Date().toISOString()});impStats.none++;}
        else{await addToBundle(l,a);}}
      catch(e){const c=e&&e.code;
        if(c==='quota_or_state'){stopImport('המקום לקבצים במערכת נגמר. הקבצים שכבר נשמרו נשארים.');return}
        if(['needs_reauth','server_not_connected','not_in_manifest','approval_required','blocked_by_policy','selection_required','no_mcp','upstream_auth'].includes(c)){stopImport(MCPMSG[c]||'אין גישה ל-Gmail. בדוק את החיבור ונסה שוב.');return}
        if(c==='too_large'||c==='unsupported_type'||c==='invalid_request'){try{await db.collection('cv').doc(l._k).set({none:true,skip:c,at:new Date().toISOString()})}catch(x){}impStats.none++}
        else{impStats.err++;await new Promise(r=>setTimeout(r,c==='rate_limited'||c==='server_unavailable'?20000:3000))}}
      if(impOpen)drawImport();
    }}
  await Promise.all([worker(),worker()]);
  try{await flushBundle()}catch(e){if(e&&e.code==='quota_or_state'){stopImport('המקום לקבצים במערכת נגמר. הקבצים שכבר נשמרו נשארים.');return}}
  if(impRun)stopImport(impTodo().length?'הסבב הסתיים. לחץ שוב כדי לנסות את מה שנכשל.':'כל קורות החיים נבדקו ונשמרו במערכת.');
}
$('importBtn').addEventListener('click',()=>{impOpen=true;openKey='__import';$('scrim').hidden=false;$('sheet').hidden=false;drawImport()});
// ---------- export
$('exportBtn').addEventListener('click',async()=>{
  const A=all().filter(l=>matches(l,eff(l),false));
  const H=['שם מלא','טלפון','גיל','עיר','תחום','סוג רישיון','תפקיד','חברה','סטטוס','קבוצת סטטוס','לחזור בתאריך','סיכומי שיחות','פירוט מהמייל','תאריך הגשה','קישור להגשה'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
  const lines=[H.map(q).join(',')];
  for(const l of A){const E=eff(l);lines.push([l.n,E.phone,l.a,cityLabel(E.city),l.f,l.l,l.r,l.co,E.status,grp(E.status),E.followUp,E.calls.map(c=>new Date(c.at).toLocaleDateString('he-IL')+': '+c.text).join(' | '),l.rs,l.d,l.added?'':gmail(l.ids[l.ids.length-1])].map(q).join(','));}
  const csv='﻿'+lines.join('\r\n');
  const btn=$('exportBtn');
  if(!downloads){btn.textContent='ייצוא לא זמין כאן';setTimeout(()=>btn.textContent='ייצוא לאקסל',2500);return}
  try{await downloads.save({filename:`לידים_${today()}.csv`,data:new Blob([csv],{type:'text/csv;charset=utf-8'})});btn.textContent=`יוצאו ${A.length}`;}
  catch(e){btn.textContent=e&&e.code==='declined'?'הייצוא בוטל':'הייצוא לא הצליח';}
  setTimeout(()=>btn.textContent='ייצוא לאקסל',2500);
});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--deck-h',$('deck').offsetHeight+'px'));
render();
})();
</script>
